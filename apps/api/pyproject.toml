[project]
name = "skf-api"
version = "0.1.0"
description = "SKF Skill Studio API: skills, runs, compute backends, logs, evaluation and release gate"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.35",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "redis>=5.2,<6", # arq 0.28 requires redis<6
    "arq>=0.26",
    "boto3[crt]>=1.40",
    "pyyaml>=6.0",
    "cryptography>=45",
    "kaggle>=1.7",
    "orjson>=3.11",
    "jsonschema>=4.23", # validates target config/secret against the backend's JSON Schema
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "pyright>=1.1.400",
    "respx>=0.22",
    "moto[ec2,s3]>=5.1",
]

[project.scripts]
skf-api = "skf_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skf_api"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "B008", "RUF012"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
